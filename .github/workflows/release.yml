name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm audit --audit-level=high
      - run: xvfb-run -a npm run test:integration
      - run: npm run test:web
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: gyosjs-vsix
          path: gyosjs-*.vsix
          if-no-files-found: error

  publish_marketplace:
    needs: package
    if: ${{ vars.PUBLISH_MARKETPLACE == 'true' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: gyosjs-vsix
      - run: npx vsce publish --packagePath gyosjs-${GITHUB_REF_NAME#v}.vsix --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish_open_vsx:
    needs: package
    if: ${{ vars.PUBLISH_OPEN_VSX == 'true' }}
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: gyosjs-vsix
      - run: npx ovsx publish gyosjs-${GITHUB_REF_NAME#v}.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  github_release:
    needs: [package, publish_marketplace, publish_open_vsx]
    if: >-
      ${{
        always() &&
        needs.package.result == 'success' &&
        (needs.publish_marketplace.result == 'success' || needs.publish_marketplace.result == 'skipped') &&
        (needs.publish_open_vsx.result == 'success' || needs.publish_open_vsx.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gyosjs-vsix
      - run: gh release create "$GITHUB_REF_NAME" gyosjs-${GITHUB_REF_NAME#v}.vsix --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
