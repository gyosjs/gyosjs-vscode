name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run test:web
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: gyosjs-vsix
          path: gyosjs-*.vsix
          if-no-files-found: error

  minimum-vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VSCODE_TEST_VERSION: 1.90.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration
